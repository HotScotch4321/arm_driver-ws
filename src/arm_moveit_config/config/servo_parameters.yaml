servo_node:
  ros__parameters:
    move_group_name: "arm"
    command_out_topic: "/arm_controller/joint_trajectory"
    
    scale:
      linear: 0.15
      rotational: 0.3
      joint: 0.25
    
    incoming_command_timeout: 0.8
    publish_period: 0.02
    
    joint_limit_margins: [0.25]
    override_velocity_scaling_factor: 0.1
    
    check_collisions: false
    use_smoothing: true
    
    halt_all_joints_in_cartesian_mode: true
    halt_all_joints_in_joint_mode: true